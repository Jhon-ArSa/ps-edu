# ══════════════════════════════════════════════════════════════════════════════
# CONFIGURACIÓN DE SUPERVISOR PARA PS-EDU
# ══════════════════════════════════════════════════════════════════════════════
# 
# Supervisor mantiene el worker de colas ejecutándose continuamente.
# Si el proceso falla, Supervisor lo reinicia automáticamente.
#
# INSTALACIÓN:
# 1. sudo apt-get install supervisor
# 2. Copiar este archivo a: /etc/supervisor/conf.d/psedu-worker.conf
# 3. sudo supervisorctl reread
# 4. sudo supervisorctl update
# 5. sudo supervisorctl start psedu-worker:*
#
# COMANDOS ÚTILES:
# - Ver estado:    sudo supervisorctl status
# - Reiniciar:     sudo supervisorctl restart psedu-worker:*
# - Detener:       sudo supervisorctl stop psedu-worker:*
# - Ver logs:      sudo tail -f /var/log/supervisor/psedu-worker.log
# ══════════════════════════════════════════════════════════════════════════════

[program:psedu-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/psedu/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=60
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/psedu-worker.log
stopwaitsecs=3600

# ── EXPLICACIÓN DE PARÁMETROS ─────────────────────────────────────────────────
#
# command:
#   - queue:work redis      → Procesa trabajos de la cola Redis
#   - --sleep=3             → Espera 3 segundos si no hay trabajos
#   - --tries=3             → Reintenta 3 veces si falla
#   - --max-time=3600       → Reinicia el worker cada hora (previene memory leaks)
#   - --timeout=60          → Timeout de 60 segundos por trabajo
#
# numprocs=2:
#   - Ejecuta 2 workers en paralelo para mejor rendimiento
#   - Ajustar según carga (200-300 usuarios → 2-4 workers)
#
# user=www-data:
#   - Usuario del servidor web (puede ser 'nginx' o 'apache')
#
# stopwaitsecs=3600:
#   - Espera hasta 1 hora para que termine el trabajo actual antes de forzar stop
# ══════════════════════════════════════════════════════════════════════════════
